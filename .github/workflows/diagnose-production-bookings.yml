name: Diagnose production booking blockers (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: delnavazan-production-booking-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    name: Read-only production booking and notification diagnostic
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Configure pinned production SSH access
        shell: bash
        env:
          PRODUCTION_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          PRODUCTION_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          [[ -n "$PRODUCTION_SSH_PRIVATE_KEY" && -n "$PRODUCTION_KNOWN_HOSTS" ]] || { echo 'Production SSH secrets are not configured.' >&2; exit 1; }
          grep -Eq '^cp119\.hosting-cloud\.net[[:space:]]+ssh-(ed25519|rsa|ecdsa)' <<<"$PRODUCTION_KNOWN_HOSTS" || { echo 'Known-hosts must pin cp119.hosting-cloud.net.' >&2; exit 1; }
          install -m 700 -d "$HOME/.ssh"
          install -m 600 /dev/null "$HOME/.ssh/id_production"
          printf '%s\n' "$PRODUCTION_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_production"
          printf '%s\n' "$PRODUCTION_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_production" >/dev/null
          cat >> "$HOME/.ssh/config" <<'EOF'
          Host cp119.hosting-cloud.net
            UserKnownHostsFile ~/.ssh/known_hosts
            StrictHostKeyChecking yes
            IdentityFile ~/.ssh/id_production
            IdentitiesOnly yes
            BatchMode yes
          EOF
          chmod 600 "$HOME/.ssh/config"
      - name: Collect read-only booking blocker evidence
        shell: bash
        env:
          PRODUCTION_SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
        run: |
          set -Eeuo pipefail
          [[ -n "$PRODUCTION_SSH_USER" ]] || { echo 'Production SSH user is not configured.' >&2; exit 1; }
          bash deployment/qa/production-booking-blockers-diagnostic.sh | tee "$RUNNER_TEMP/production-booking-blockers.txt"
      - name: Preserve diagnostic evidence
        if: always() && hashFiles('${{ runner.temp }}/production-booking-blockers.txt') != ''
        uses: actions/upload-artifact@v4
        with:
          name: production-booking-blockers-${{ github.sha }}
          path: ${{ runner.temp }}/production-booking-blockers.txt
