name: PR runtime gate

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-runtime-gate-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  source-contracts:
    name: PHP source contracts
    runs-on: ubuntu-24.04

    steps:
      - name: Check out pull request
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Report PHP version
        run: php --version

      - name: Lint tracked PHP
        shell: bash
        run: |
          set -Eeuo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(git ls-files -z '*.php')

      - name: Check pull-request patch whitespace
        run: git diff --check HEAD^1 HEAD

      - name: Run verified source-level Platform contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          contracts=(
            platform/tests/phase-1b-contract.php
            platform/tests/phase-1d-contract.php
            platform/tests/phase-1e-contract.php
            platform/tests/phase-1f-contract.php
            platform/tests/phase-2a0-contract.php
            platform/tests/phase-2a0-independent-review-contract.php
            platform/tests/phase-2a1a-contract.php
            platform/tests/phase-2a1b-contract.php
            platform/tests/phase-2a1c-contract.php
            platform/tests/phase-2a1d-contract.php
            platform/tests/phase-2a2a-contract.php
            platform/tests/phase-2a2b-contract.php
            platform/tests/phase-2a2c-contract.php
            platform/tests/phase-2a2d-contract.php
            platform/tests/phase-2a2e-contract.php
            platform/tests/phase-2a2f-concurrency-contract.php
            platform/tests/phase-2a2f-contract.php
            platform/tests/phase-2a2q-contract.php
            platform/tests/phase-2a2n-contract.php
          )
          for contract in "${contracts[@]}"; do
            php "$contract"
          done
          php platform/tests/phase-2a3-iran-quiet-hours.php
          php platform/tests/phase-2a3-day-availability-contract.php
          php platform/tests/booking-availability-timezone-dst-contract.php
          php platform/tests/booking-canonical-occupancy-contract.php
          php platform/tests/teacher-availability-dst-contract.php
          php platform/tests/booking-preference-order-contract.php
          php platform/tests/booking-public-window-contract.php
          php platform/tests/operations-dashboard-source-contract.php
          php platform/tests/teacher-availability-lifecycle-contract.php
          php platform/tests/launch-portal-hardening-contract.php
          php platform/tests/phase-opreadiness-core-operator-entrypoint-contract.php
          php platform/tests/phase-opreadiness-core-operator-entrypoint-unit.php
          php platform/tests/onboarding-admin-authority-contract.php
          php platform/tests/notification-copy-registry-contract.php
          php platform/tests/notification-transport-routing-contract.php
          php platform/tests/notification-composite-transport-contract.php
          php platform/tests/notification-system-actor-contract.php
          php platform/tests/notification-dispatch-worker-contract.php
          php platform/tests/student-notification-recipient-contract.php
          php platform/tests/notification-transport-recipient-resolver-contract.php
          php platform/tests/notification-runtime-factory-contract.php
          php platform/tests/notification-worker-bootstrap-contract.php
          php platform/tests/notification-delivery-evidence-contract.php
          php platform/tests/notification-delivery-state-contract.php
          php platform/tests/notification-handoff-reconciliation-contract.php
          php platform/tests/customer-checkout-contract.php
          php platform/tests/stripe-checkout-adapter-contract.php
          php platform/tests/stripe-checkout-adapter-unit.php
          php platform/tests/stripe-checkout-reconciliation-contract.php
          php platform/tests/stripe-checkout-webhook-contract.php
          php platform/tests/stripe-checkout-webhook-unit.php
          php platform/tests/checkout-session-authority-contract.php
          php platform/tests/student-checkout-initiation-contract.php
          php platform/tests/checkout-session-lifecycle-contract.php
          php platform/tests/checkout-session-reference-contract.php
          php platform/tests/checkout-session-reference-vault-unit.php
          php platform/tests/student-checkout-return-contract.php
          php platform/tests/student-notification-recipient-authority-contract.php
          php platform/tests/notification-copy-integrity-contract.php
          php platform/tests/student-account-claim-notification-atomic-contract.php
          php platform/tests/phase-opreadiness-core-operator-entrypoint-contract.php
          php platform/tests/phase-opreadiness-core-operator-entrypoint-unit.php
          php platform/tests/booking-canonical-alias-contract.php
          php platform/tests/booking-route-state-contract.php
          php platform/tests/booking-day-grid-theme-contract.php
          if [[ -f platform/tests/phase-student-portal-state-contract.php ]]; then
            php platform/tests/phase-student-portal-state-contract.php
          else
            echo 'Student Portal state contract not present on this PR base yet.'
          fi
          if [[ -f platform/tests/teacher-onboarding-v1-contract.php ]]; then
            php platform/tests/teacher-onboarding-v1-contract.php
          else
            echo 'Teacher onboarding v1 contract not present on this PR base yet.'
          fi
          php platform/tests/admin-navigation-regression-contract.php
          if [[ -f platform/tests/phase-operations-portal-contract.php ]]; then
            php platform/tests/phase-operations-portal-contract.php
          else
            echo 'Operations portal contract not present on this PR base yet.'
          fi

      - name: Check staging smoke runner syntax
        run: bash -n deployment/qa/staging-smoke.sh

      - name: Check staging deployment tooling
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n deployment/staging-deploy.sh
          bash -n deployment/qa/staging-deployment-contract.sh
          bash deployment/qa/staging-deployment-contract.sh

      - name: Check production deployment tooling
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n deployment/production-deploy.sh
          bash -n deployment/qa/production-smoke.sh
          bash -n deployment/qa/production-deployment-contract.sh
          bash deployment/qa/production-deployment-contract.sh
