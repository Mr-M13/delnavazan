  oauth-scope-database-regression:
    name: OAuth scope MariaDB regression
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: dzn_oauth_scope_test_ci
          MARIADB_USER: wordpress
          MARIADB_PASSWORD: wordpress
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=3s
          --health-timeout=3s
          --health-retries=30
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
          coverage: none
      - name: Run exact OAuth scope database regression
        env:
          DZN_OAUTH_SCOPE_TEST_DB_HOST: 127.0.0.1
          DZN_OAUTH_SCOPE_TEST_DB_PORT: 3306
          DZN_OAUTH_SCOPE_TEST_DB_NAME: dzn_oauth_scope_test_ci
          DZN_OAUTH_SCOPE_TEST_DB_USER: wordpress
          DZN_OAUTH_SCOPE_TEST_DB_PASSWORD: wordpress
        run: php platform/tests/oauth-scope-exact-matching-db.php
