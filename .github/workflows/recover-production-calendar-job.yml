name: Recover production calendar job

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact full SHA of current origin/main
        type: string
        required: true
      job_id:
        description: Exact failed lesson_reschedule_calendar_jobs id
        type: string
        required: true
      confirm:
        description: Type RECOVER to requeue and dispatch this one failed job
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: delnavazan-production-calendar-recovery
  cancel-in-progress: false

jobs:
  recover:
    name: Recover one failed calendar hand-off
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Require dispatch from main
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]] || { echo 'Run this recovery workflow from main only.' >&2; exit 1; }

      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Validate exact main SHA, job id and confirmation
        shell: bash
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          JOB_ID: ${{ inputs.job_id }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -Eeuo pipefail
          [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Provide one full 40-character commit SHA.' >&2; exit 1; }
          [[ "$JOB_ID" =~ ^[1-9][0-9]*$ ]] || { echo 'Provide one positive job id.' >&2; exit 1; }
          [[ "$CONFIRM" == 'RECOVER' ]] || { echo 'Type RECOVER to confirm this one-job production recovery.' >&2; exit 1; }
          git fetch --no-tags origin main
          [[ "$(git rev-parse origin/main)" == "$COMMIT_SHA" ]] || { echo 'Requested SHA must still be current origin/main.' >&2; exit 1; }
          bash -n deployment/qa/production-calendar-job-recovery.sh
          bash deployment/qa/production-calendar-job-recovery-contract.sh

      - name: Configure pinned production SSH access
        shell: bash
        env:
          PRODUCTION_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          PRODUCTION_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          [[ -n "$PRODUCTION_SSH_PRIVATE_KEY" && -n "$PRODUCTION_KNOWN_HOSTS" ]] || { echo 'Production SSH secrets are not configured in the protected production environment.' >&2; exit 1; }
          grep -Eq '^cp119\.hosting-cloud\.net[[:space:]]+ssh-(ed25519|rsa|ecdsa)' <<<"$PRODUCTION_KNOWN_HOSTS" || { echo 'Known-hosts secret must pin cp119.hosting-cloud.net.' >&2; exit 1; }
          install -m 700 -d "$HOME/.ssh"
          install -m 600 /dev/null "$HOME/.ssh/id_production"
          printf '%s\n' "$PRODUCTION_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_production"
          printf '%s\n' "$PRODUCTION_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_production" >/dev/null
          cat >> "$HOME/.ssh/config" <<'EOF'
          Host cp119.hosting-cloud.net
            UserKnownHostsFile ~/.ssh/known_hosts
            StrictHostKeyChecking yes
            IdentityFile ~/.ssh/id_production
            IdentitiesOnly yes
            BatchMode yes
          EOF
          chmod 600 "$HOME/.ssh/config"

      - name: Recover and verify
        shell: bash
        env:
          PRODUCTION_SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          JOB_ID: ${{ inputs.job_id }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -Eeuo pipefail
          [[ -n "$PRODUCTION_SSH_USER" ]] || { echo 'Production SSH user is not configured.' >&2; exit 1; }
          bash deployment/qa/production-calendar-job-recovery.sh "$COMMIT_SHA" "$JOB_ID" "$CONFIRM" | tee "$RUNNER_TEMP/calendar-job-recovery.txt"

      - name: Preserve recovery evidence
        if: always() && hashFiles('${{ runner.temp }}/calendar-job-recovery.txt') != ''
        uses: actions/upload-artifact@v4
        with:
          name: calendar-job-recovery-${{ inputs.job_id }}
          path: ${{ runner.temp }}/calendar-job-recovery.txt
