  recording-services:
    name: Recording recorder/archive and playback services
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, curl, mbstring
          coverage: none
      - run: bash services/tests/run-all.sh

  stripe-runtime-e2e:
    name: Stripe runtime E2E
    runs-on: ubuntu-24.04
    permissions:
      contents: read
