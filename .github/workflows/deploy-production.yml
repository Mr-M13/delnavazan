name: Deploy production

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        type: choice
        options: [production]
        required: true
      commit_sha:
        description: Exact full SHA of the current origin/main commit
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: delnavazan-production-deploy
  cancel-in-progress: false

jobs:
  source-gate:
    name: Current-main source gate
    uses: ./.github/workflows/pr-runtime-gate.yml

  deploy:
    name: Deploy and verify production
    runs-on: ubuntu-24.04
    environment: production
    needs: source-gate
    steps:
      - name: Require dispatch from main
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]] || { echo 'Run this workflow from the main branch only.' >&2; exit 1; }

      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Validate requested exact main SHA
        shell: bash
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -Eeuo pipefail
          [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Provide one full 40-character commit SHA.' >&2; exit 1; }
          git fetch --no-tags origin main
          [[ "$(git rev-parse origin/main)" == "$COMMIT_SHA" ]] || { echo 'Requested SHA must still be current origin/main.' >&2; exit 1; }
          test -f platform/tests/phase-student-portal-state-contract.php
          test -f platform/tests/admin-navigation-regression-contract.php
          bash -n deployment/production-deploy.sh
          bash -n deployment/qa/production-smoke.sh
          bash -n deployment/qa/production-deployment-contract.sh
          bash deployment/qa/production-deployment-contract.sh

      - name: Configure pinned production SSH access
        shell: bash
        env:
          PRODUCTION_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          PRODUCTION_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          [[ -n "$PRODUCTION_SSH_PRIVATE_KEY" && -n "$PRODUCTION_KNOWN_HOSTS" ]] || { echo 'Production SSH secrets are not configured in the protected production environment.' >&2; exit 1; }
          grep -Eq '^cp119\.hosting-cloud\.net[[:space:]]+ssh-(ed25519|rsa|ecdsa)' <<<"$PRODUCTION_KNOWN_HOSTS" || { echo 'Known-hosts secret must pin cp119.hosting-cloud.net.' >&2; exit 1; }
          install -m 700 -d "$HOME/.ssh"
          install -m 600 /dev/null "$HOME/.ssh/id_production"
          printf '%s\n' "$PRODUCTION_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_production"
          printf '%s\n' "$PRODUCTION_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_production" >/dev/null
          cat >> "$HOME/.ssh/config" <<'EOF'
          Host cp119.hosting-cloud.net
            UserKnownHostsFile ~/.ssh/known_hosts
            StrictHostKeyChecking yes
            IdentityFile ~/.ssh/id_production
            IdentitiesOnly yes
            BatchMode yes
          EOF
          chmod 600 "$HOME/.ssh/config"

      - name: Deploy exact current-main SHA
        id: deploy
        shell: bash
        env:
          PRODUCTION_SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          PRODUCTION_BACKUP_DIR: ${{ secrets.PRODUCTION_BACKUP_DIR }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          TARGET: ${{ inputs.target }}
        run: |
          set -Eeuo pipefail
          [[ -n "$PRODUCTION_SSH_USER" && -n "$PRODUCTION_BACKUP_DIR" ]] || { echo 'Production SSH user/backup path are not configured.' >&2; exit 1; }
          [[ "$PRODUCTION_SSH_USER" =~ ^[A-Za-z0-9._-]+$ ]] || { echo 'Production SSH username contains unsupported characters.' >&2; exit 1; }
          deployment/production-deploy.sh "$TARGET" "$COMMIT_SHA" | tee "$RUNNER_TEMP/production-deployment.json"
          cp "$RUNNER_TEMP/production-deployment.json" "$GITHUB_WORKSPACE/production-deployment.json"

      - name: Run read-only production smoke checks
        id: smoke
        continue-on-error: true
        run: bash deployment/qa/production-smoke.sh https://delnavazan.com

      - name: Confirm smoke failure with an independent probe
        id: confirmation
        if: steps.smoke.outcome == 'failure'
        continue-on-error: true
        run: bash deployment/qa/production-smoke.sh --confirm https://delnavazan.com

      - name: Decide maintenance and release status
        id: decision
        if: always() && steps.smoke.outcome != 'skipped'
        shell: bash
        run: |
          set -Eeuo pipefail
          primary="${{ steps.smoke.outcome }}"
          confirmation="${{ steps.confirmation.outcome }}"
          [[ -n "$confirmation" ]] || confirmation="skipped"
          rc=0
          bash deployment/qa/production-smoke-decision.sh "$primary" "$confirmation" || rc=$?
          if [[ "$rc" == 0 ]]; then
            maintenance="yes"; release_status="failed"
            echo "Maintenance required: primary=$primary confirmation=$confirmation" >&2
          elif [[ "$rc" == 1 ]]; then
            maintenance="no"; release_status="passed"
            [[ "$primary" == "success" ]] || echo "::warning::Primary smoke failed transiently; independent confirmation passed. Maintenance was not enabled."
          else
            maintenance="yes"; release_status="failed"
            echo "Smoke decision failed closed (exit $rc); maintenance required." >&2
          fi
          echo "maintenance=$maintenance" >> "$GITHUB_OUTPUT"
          echo "release_status=$release_status" >> "$GITHUB_OUTPUT"
          if [[ "$maintenance" == "yes" ]]; then maintenance_state="required"; else maintenance_state="not_required"; fi
          printf '%s\n' "{\"status\":\"$release_status\",\"primary_smoke\":\"$primary\",\"confirmation_smoke\":\"$confirmation\",\"maintenance_mode\":\"$maintenance_state\"}" > "$GITHUB_WORKSPACE/production-verification.json"

      - name: Activate maintenance after confirmed failure
        if: steps.decision.outputs.maintenance == 'yes'
        shell: bash
        env:
          PRODUCTION_SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
        run: |
          set -Eeuo pipefail
          ssh -T "${PRODUCTION_SSH_USER}@cp119.hosting-cloud.net" 'wp --path="$HOME/domains/delnavazan.com/public_html" maintenance-mode activate'
          printf '%s\n' '{"status":"smoke_failed","primary_smoke":"${{ steps.smoke.outcome }}","confirmation_smoke":"${{ steps.confirmation.outcome }}","maintenance_mode":"enabled"}' > "$GITHUB_WORKSPACE/production-verification.json"

      - name: Fail release after confirmed smoke failure
        if: steps.decision.outputs.maintenance == 'yes'
        shell: bash
        run: |
          echo 'The primary and independent confirmation probes both failed. Production remains in maintenance mode.' >&2
          exit 1

      - name: Fail closed when the smoke decision is unavailable
        if: always() && steps.smoke.outcome == 'failure' && steps.decision.outcome != 'success'
        shell: bash
        env:
          PRODUCTION_SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
        run: |
          set -Eeuo pipefail
          ssh -T "${PRODUCTION_SSH_USER}@cp119.hosting-cloud.net" 'wp --path="$HOME/domains/delnavazan.com/public_html" maintenance-mode activate'
          printf '%s\n' '{"status":"smoke_decision_unavailable","maintenance_mode":"enabled"}' > "$GITHUB_WORKSPACE/production-verification.json"
          echo 'Smoke decision was unavailable; maintenance mode enabled and release failed.' >&2
          exit 1

      - name: Preserve machine-readable deployment record
        if: always() && hashFiles('production-deployment.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: production-deployment-${{ inputs.commit_sha }}
          path: |
            ${{ runner.temp }}/production-deployment.json
            production-verification.json
          if-no-files-found: warn
