  stripe-runtime-e2e:
    name: Stripe runtime E2E
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Preload disposable runtime images
        run: |
          docker pull mariadb:11.4
          docker pull wordpress:php8.3-apache
          docker pull wordpress:cli-php8.3
      - name: Run offline Stripe Checkout test-mode E2E
        env:
          DZN_RUNTIME_STATE_DIR: /tmp/dzn-stripe-runtime-e2e
          DZN_COMPOSE_PROJECT: dzn-stripe-runtime-e2e
        run: platform/runtime/bin/run-stripe-checkout-test-mode-e2e.sh

  post-intro-runtime:
    name: Post-intro runtime lifecycle
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Preload disposable runtime images
        run: |
          docker pull mariadb:11.4
          docker pull wordpress:php8.3-apache
          docker pull wordpress:cli-php8.3
      - name: Run disposable post-intro lifecycle
        env:
          DZN_RUNTIME_STATE_DIR: /tmp/dzn-post-intro-runtime
          DZN_COMPOSE_PROJECT: dzn-post-intro-runtime
          DZN_WP_PORT: 18080
        run: platform/runtime/bin/run-post-intro-runtime.sh
      - name: Dispose runtime
        if: always()
        env:
          DZN_RUNTIME_STATE_DIR: /tmp/dzn-post-intro-runtime
          DZN_COMPOSE_PROJECT: dzn-post-intro-runtime
          DZN_WP_PORT: 18080
        run: platform/runtime/bin/destroy.sh YES || true

