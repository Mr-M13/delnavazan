name: PR runtime gate

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-runtime-gate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  risk-classification:
    name: Deployment risk classification
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed paths
        shell: bash
        run: |
          set -Eeuo pipefail
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [[ -z "$base" || "$base" == 0000000000000000000000000000000000000000 ]]; then
            base="HEAD^"
          fi
          bash deployment/qa/deployment-risk-classifier.sh "$base" "$GITHUB_SHA" | tee "$RUNNER_TEMP/deployment-risk.txt"
      - name: Test classifier safety boundaries
        run: bash deployment/qa/deployment-risk-classifier-unit.sh

  source-contracts:
    name: PHP source contracts
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Report PHP version
        run: php --version

      - name: Lint tracked PHP
        shell: bash
        run: |
          set -Eeuo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(git ls-files -z '*.php')

      - name: Check patch whitespace
        run: git diff --check HEAD^1 HEAD

      - name: Run verified source-level Platform contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          contracts=(
            platform/tests/integration-control-plane-contract.php
            platform/tests/legal-pages-contract.php
            platform/tests/recording-research-architecture-contract.php
            platform/tests/recording-decision-authority-contract.php
            platform/tests/recording-archive-contract.php
            platform/tests/recording-choices-ui-contract.php
            platform/tests/fresh-install-capability-bootstrap.php
            platform/tests/integration-settings-runtime.php
            platform/tests/google-integration-test-runtime.php
            platform/tests/integration-mail-diagnostics-runtime.php
            platform/tests/phase-1b-contract.php
            platform/tests/phase-1d-contract.php
            platform/tests/phase-1e-contract.php
            platform/tests/phase-1f-contract.php
            platform/tests/phase-2a0-contract.php
            platform/tests/phase-2a0-independent-review-contract.php
            platform/tests/teacher-admin-principal-link-contract.php
            platform/tests/teacher-admin-ux-contract.php
            platform/tests/teacher-registration-lifecycle-overhaul-contract.php
            platform/tests/phase-2a1a-contract.php
            platform/tests/phase-2a1b-contract.php
            platform/tests/phase-2a1c-contract.php
            platform/tests/phase-2a1d-contract.php
            platform/tests/phase-2a2a-contract.php
            platform/tests/phase-2a2b-contract.php
            platform/tests/phase-2a2c-contract.php
            platform/tests/phase-2a2d-contract.php
            platform/tests/phase-2a2e-contract.php
            platform/tests/phase-2a2f-concurrency-contract.php
            platform/tests/phase-2a2f-contract.php
            platform/tests/phase-2a2q-contract.php
            platform/tests/phase-2a2n-contract.php
            platform/tests/livekit-attendance-contract.php
          )
          for contract in "${contracts[@]}"; do
            php "$contract"
          done
          php platform/tests/recording-archive-policy-unit.php
          php platform/tests/recording-archive-contract.php
          php platform/tests/quiet-hours-advisory-unit.php
          php platform/tests/quiet-hours-advisory-contract.php
