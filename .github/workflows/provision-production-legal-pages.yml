name: Provision production legal drafts

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact full SHA of current origin/main
        type: string
        required: true
      confirm:
        description: Type PROVISION_LEGAL_DRAFTS to create/refresh the five legal drafts
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: delnavazan-production-legal-drafts
  cancel-in-progress: false

jobs:
  provision:
    name: Create legal-policy drafts without publishing
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Require dispatch from main
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]] || { echo 'Run this provisioning workflow from main only.' >&2; exit 1; }

      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Validate exact main SHA and confirmation
        shell: bash
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -Eeuo pipefail
          [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Provide one full 40-character commit SHA.' >&2; exit 1; }
          [[ "$CONFIRM" == 'PROVISION_LEGAL_DRAFTS' ]] || { echo 'Type PROVISION_LEGAL_DRAFTS to confirm.' >&2; exit 1; }
          git fetch --no-tags origin main
          [[ "$(git rev-parse origin/main)" == "$COMMIT_SHA" ]] || { echo 'Requested SHA must still be current origin/main.' >&2; exit 1; }
          bash deployment/qa/provision-production-legal-pages-contract.sh

      - name: Configure pinned production SSH access
        shell: bash
        env:
          PRODUCTION_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          PRODUCTION_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          [[ -n "$PRODUCTION_SSH_PRIVATE_KEY" && -n "$PRODUCTION_KNOWN_HOSTS" ]] || { echo 'Production SSH secrets are not configured in the protected environment.' >&2; exit 1; }
          grep -Eq '^cp119\.hosting-cloud\.net[[:space:]]+ssh-(ed25519|rsa|ecdsa)' <<<"$PRODUCTION_KNOWN_HOSTS" || { echo 'Known-hosts secret must pin cp119.hosting-cloud.net.' >&2; exit 1; }
          install -m 700 -d "$HOME/.ssh"
          install -m 600 /dev/null "$HOME/.ssh/id_production"
          printf '%s\n' "$PRODUCTION_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_production"
          printf '%s\n' "$PRODUCTION_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_production" >/dev/null
          cat >> "$HOME/.ssh/config" <<'EOF'
          Host cp119.hosting-cloud.net
            UserKnownHostsFile ~/.ssh/known_hosts
            StrictHostKeyChecking yes
            IdentityFile ~/.ssh/id_production
            IdentitiesOnly yes
            BatchMode yes
          EOF
          chmod 600 "$HOME/.ssh/config"

      - name: Provision and verify drafts
        shell: bash
        env:
          PRODUCTION_SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -Eeuo pipefail
          [[ -n "$PRODUCTION_SSH_USER" ]] || { echo 'Production SSH user is not configured.' >&2; exit 1; }
          bash deployment/qa/provision-production-legal-pages.sh "$COMMIT_SHA" "$CONFIRM" | tee "$RUNNER_TEMP/legal-drafts-provision.txt"

      - name: Preserve provisioning evidence
        if: always() && hashFiles('${{ runner.temp }}/legal-drafts-provision.txt') != ''
        uses: actions/upload-artifact@v4
        with:
          name: legal-drafts-provision-${{ inputs.commit_sha }}
          path: ${{ runner.temp }}/legal-drafts-provision.txt
