  recording-decision-migration-runtime:
    name: Recording decision migration runtime
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: |
          docker pull mariadb:11.4
          docker pull wordpress:php8.3-apache
          docker pull wordpress:cli-php8.3
      - run: platform/runtime/bin/run-recording-decision-migration-runtime.sh
      - name: Dispose recording decision migration runtime
        if: always()
        run: |
          export DZN_COMPOSE_PROJECT=dzn-recording-decision-migration
          export DZN_RUNTIME_STATE_DIR=/tmp/dzn-recording-decision-migration
          export DZN_WP_PORT=18082
          platform/runtime/bin/destroy.sh YES

