name: Deploy staging

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        type: choice
        options: [staging]
        required: true
      commit_sha:
        description: Exact full SHA of the current origin/main commit
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: delnavazan-staging-deploy
  cancel-in-progress: false

jobs:
  source-gate:
    name: Current-main source gate
    uses: ./.github/workflows/pr-runtime-gate.yml

  deploy:
    name: Deploy and verify staging
    runs-on: ubuntu-24.04
    environment: staging
    needs: source-gate
    steps:
      - name: Require dispatch from main
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]] || { echo 'Run this workflow from the main branch only.' >&2; exit 1; }

      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up PHP for the admin navigation contract
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Require integrated portal and admin navigation guards
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f platform/tests/phase-student-portal-read-model-contract.php || { echo 'PR #137 portal hardening and its source contract must be integrated into main before staging.' >&2; exit 1; }
          test -f platform/tests/admin-navigation-regression-contract.php || { echo 'PR #138 admin navigation fix and its source contract must be integrated into main before staging.' >&2; exit 1; }
          php platform/tests/phase-student-portal-read-model-contract.php
          php platform/tests/admin-navigation-regression-contract.php

      - name: Configure pinned staging SSH access
        shell: bash
        env:
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          [[ -n "$STAGING_SSH_PRIVATE_KEY" && -n "$STAGING_KNOWN_HOSTS" ]] || { echo 'Staging SSH secrets are not configured.' >&2; exit 1; }
          grep -Eq '^staging\.delnavazan\.com[[:space:]]+ssh-(ed25519|rsa|ecdsa)' <<<"$STAGING_KNOWN_HOSTS" || { echo 'Known-hosts secret must pin staging.delnavazan.com.' >&2; exit 1; }
          install -m 700 -d "$HOME/.ssh"
          install -m 600 /dev/null "$HOME/.ssh/id_deploy_staging"
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_deploy_staging"
          printf '%s\n' "$STAGING_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_deploy_staging" >/dev/null
          cat >> "$HOME/.ssh/config" <<'EOF'
          Host staging.delnavazan.com
            UserKnownHostsFile ~/.ssh/known_hosts
            StrictHostKeyChecking yes
            IdentityFile ~/.ssh/id_deploy_staging
            IdentitiesOnly yes
            BatchMode yes
          EOF
          chmod 600 "$HOME/.ssh/config"

      - name: Deploy exact current-main SHA
        id: deploy
        shell: bash
        env:
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_BACKUP_DIR: ${{ secrets.STAGING_BACKUP_DIR }}
          TARGET: ${{ inputs.target }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -Eeuo pipefail
          [[ -n "$STAGING_SSH_USER" && -n "$STAGING_BACKUP_DIR" ]] || { echo 'Staging SSH user/backup path are not configured.' >&2; exit 1; }
          [[ "$STAGING_SSH_USER" =~ ^[A-Za-z0-9._-]+$ ]] || { echo 'Staging SSH username contains unsupported characters.' >&2; exit 1; }
          deployment/staging-deploy.sh "$TARGET" "$COMMIT_SHA" | tee "$RUNNER_TEMP/staging-deployment.json"
          cp "$RUNNER_TEMP/staging-deployment.json" "$GITHUB_WORKSPACE/staging-deployment.json"

      - name: Run read-only staging smoke checks
        id: smoke
        run: bash deployment/qa/staging-smoke.sh https://staging.delnavazan.com

      - name: Keep staging in maintenance after failed smoke
        if: failure() && steps.smoke.outcome == 'failure'
        shell: bash
        env:
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
        run: |
          set -Eeuo pipefail
          ssh -T "${STAGING_SSH_USER}@staging.delnavazan.com" 'wp --path="$HOME/domains/staging.delnavazan.com/public_html" maintenance-mode activate'
          printf '%s\n' '{"status":"smoke_failed","maintenance_mode":"enabled"}' > "$GITHUB_WORKSPACE/staging-verification.json"

      - name: Preserve machine-readable deployment record
        if: always() && hashFiles('staging-deployment.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: staging-deployment-${{ inputs.commit_sha }}
          path: |
            ${{ runner.temp }}/staging-deployment.json
            staging-verification.json
          if-no-files-found: warn
